[project]
name = "devpilot"
version = "0.1.0"
description = "AI ops assistant for infrastructure: on-demand diagnosis over MCP and automatic outage alerting"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "mcp>=2.0",
    "uvicorn",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
